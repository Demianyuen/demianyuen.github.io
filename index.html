<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- SEO Meta Tags -->
    <title>Demian's Blog - 獨立觀察與深度思考</title>
    <meta name="description" content="深度觀察、社會透視、趨勢分析。每日更新，帶給你獨特的觀點與思考。">
    <meta name="keywords" content="部落格,評論,社會觀察,趨勢分析,深度思考">
    <meta name="author" content="Demian">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Demian's Blog - 獨立觀察與深度思考">
    <meta property="og:description" content="深度觀察、社會透視、趨勢分析。每日更新，帶給你獨特的觀點與思考。">
    <meta property="og:image" content="https://demianyuen.github.io/images/og-default.jpg">
    <meta property="og:url" content="https://demianyuen.github.io">
    <meta property="og:site_name" content="Demian's Blog">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Demian's Blog">
    <meta name="twitter:description" content="深度觀察與深度思考">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_ADSENSE_ID" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="site-logo">Demian's Blog</a>
                <nav class="main-nav">
                    <a href="/">首頁</a>
                    <a href="/articles.html">文章</a>
                    <a href="/about.html">關於</a>
                    <a href="/subscribe.html" class="subscribe-btn">訂閱</a>
                </nav>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">獨立觀察 · 深度思考</h1>
            <p class="hero-subtitle">探索社會現象背后的真相，分享獨特觀點與思考</p>
            <div class="hero-search">
                <input type="text" id="searchInput" placeholder="搜尋文章..." onkeyup="searchArticles()">
            </div>
        </div>
    </section>

    <!-- Featured Article -->
    <section class="featured-section">
        <div class="container">
            <h2 class="section-title">最新文章</h2>
            <article class="featured-article" id="featuredArticle">
                <!-- Featured article will be loaded dynamically -->
            </article>
        </div>
    </section>

    <!-- Articles Grid -->
    <section class="articles-section">
        <div class="container">
            <h2 class="section-title">所有文章</h2>
            <div class="articles-grid" id="articlesGrid">
                <!-- Articles will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Newsletter Section -->
    <section class="newsletter-section">
        <div class="container">
            <div class="newsletter-box">
<h3>訂閱最新文章</h3>
                <p>每週精選內容，直接送到你的信箱</p>
                <form class="newsletter-form" onsubmit="subscribeNewsletter(event)">
                    <input type="email" placeholder="輸入你的 Email" required>
                    <button type="submit">訂閱</button>
                </form>
                <p class="newsletter-note">訂閱人數：<span id="subscriberCount">1,247</span></p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>關於</h4>
                    <p>Demian's Blog - 獨立觀察與深度思考</p>
                    <p>每日更新，帶給你獨特的觀點</p>
                </div>
                <div class="footer-section">
                    <h4>快速連結</h4>
                    <ul>
                        <li><a href="/">首頁</a></li>
                        <li><a href="/articles.html">文章列表</a></li>
                        <li><a href="/about.html">關於我</a></li>
                        <li><a href="/privacy.html">隱私政策</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>社交媒體</h4>
                    <div class="social-links">
                        <a href="https://twitter.com/" target="_blank">Twitter</a>
                        <a href="https://facebook.com/" target="_blank">Facebook</a>
                        <a href="https://instagram.com/" target="_blank">Instagram</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Demian's Blog. All rights reserved.</p>
                <p>Powered by GitHub Pages</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
